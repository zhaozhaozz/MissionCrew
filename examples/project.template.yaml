# 项目定义模板:mc project add --file examples/project.template.yaml
# 项目是领域知识的载体:同一个后端装配不同项目的准则,就能做不同领域的工作。

id: myproj
name: 我的项目
description: 一句话说明项目是什么
repos:
  - ~/code/myproj

# 项目唯一主控角色。新项目先使用自动创建的 lead；之后可在 Web 中切换到其他角色，
# 该角色自身配置的 runtime/model 就是项目主控执行组合。
orchestrator_role_id: lead

# 单条人类消息引发的整条协作链最多执行多少次 Agent。只限制总次数，
# 不限制主控的调度层级；默认值为 100。
max_chain_runs: 100

# 项目准则:目标、范围、业务边界、关键概念
charter: |
  这个项目做什么、不做什么、核心领域概念有哪些。

# 开发准则:架构原则、代码要求、变更约束、兼容性要求
dev_guidelines: |
  技术栈、分层约定、API 兼容性要求、禁止事项。

# 多篇完整准则 Markdown；后端直接读取 name/description frontmatter。
# 公共上下文只注入 description；关联项目文档时使用普通相对 Markdown 链接。
guidelines:
  - markdown: |
      ---
      name: testing
      description: 修改行为、修复缺陷或设计测试时使用。
      ---

      # 测试规范

      - 修复缺陷必须提供回归测试；测试失败必须保留可复现输入和关键输出。
      - 前端界面变化应完成浏览器流程测试和视觉检查。
      - 认证逻辑变化应进行安全审查，高风险变更必须获得人工批准。

      执行方式见[本地 CI](runbooks/local-ci.md)。
  - markdown: |
      ---
      name: deployment
      description: 涉及部署、数据库迁移或生产配置时使用。
      ---

      # 部署说明

      部署前完成数据库迁移检查、配置检查和回滚演练，具体步骤见[部署手册](runbooks/deploy.md)。

# 项目 Skill 是完整说明文档；所有 Agent 都会收到已启用条目并自行判断是否适用。
skills:
  - id: myproj-local-ci
    name: 项目本地 CI
    description: 在提交前执行项目标准验证。
    instructions: |
      先阅读[本地 CI](runbooks/local-ci.md)，运行快速单元测试，再运行受影响模块的集成测试；保留失败证据。

# 可申请的受控资源 id(资源本体和密钥在平台侧登记,不进 Prompt)
resources: []
