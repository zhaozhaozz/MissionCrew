# 项目定义模板:mc project add --file examples/project.template.yaml
# 项目是领域知识的载体:同一个后端装配不同项目的准则,就能做不同领域的工作。

id: myproj
name: 我的项目
description: 一句话说明项目是什么
repos:
  - ~/code/myproj

# 项目唯一主控角色。新项目先使用自动创建的 lead；之后可在 Web 中切换到其他角色，
# 该角色自身配置的 runtime/model 就是项目主控执行组合。
orchestrator_role_id: lead

# 项目准则:目标、范围、业务边界、关键概念
charter: |
  这个项目做什么、不做什么、核心领域概念有哪些。

# 开发准则:架构原则、代码要求、变更约束、兼容性要求
dev_guidelines: |
  技术栈、分层约定、API 兼容性要求、禁止事项。

# 多篇完整准则文档；file_refs 指向项目版本化文档库内的相对路径。
guidelines:
  - id: testing
    title: 测试规范
    content: |
      修复缺陷必须提供回归测试；测试失败必须保留可复现输入和关键输出。
    file_refs: [runbooks/local-ci.md]
  - id: deployment
    title: 部署说明
    content: |
      部署前完成数据库迁移检查、配置检查和回滚演练。
    file_refs: [runbooks/deploy.md]

# 项目 Skill 是完整说明文档，可引用文档库文件，并按 backend id/adapter 选择性注入。
# runtime_ids 与 adapters 均为空时注入所有 Runtime。
skills:
  - id: myproj-local-ci
    name: 项目本地 CI
    description: 在提交前执行项目标准验证。
    instructions: |
      先运行快速单元测试，再运行受影响模块的集成测试；保留失败证据。
    file_refs: [runbooks/local-ci.md]
    runtime_ids: []
    adapters: []
    runtime_instructions:
      codex: 使用工作区沙箱执行命令。

# 可申请的受控资源 id(资源本体和密钥在平台侧登记,不进 Prompt)
resources: []

# 验证准则:匹配任务特征 -> 强制的证据 / 门禁 / 能力
rules:
  - match: { task_type: bug }
    require_evidence: [reproduction, regression_test]
    note: Bug 必须先复现,并提供修复前失败、修复后通过的回归证据
  - match: { labels: [ui] }
    require_evidence: [browser_test, screenshot]
    require_capabilities: [multimodal]
    note: 前端界面变化必须完成浏览器流程测试和视觉验证
  - match: { risk: high }
    require_gates: [human_approval]
    note: 高风险变更必须人工审批
