[project]
name = "missioncrew"
version = "0.4.0"
description = "Channel 驱动的本地多 Agent 协作平台，支持 Issue 化 Task 与项目资料"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "zhaozhaozz" }]
keywords = ["agent", "multi-agent", "claude-code", "codex", "coding-agent", "collaboration", "local"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/zhaozhaozz/MissionCrew"
Repository = "https://github.com/zhaozhaozz/MissionCrew"
Issues = "https://github.com/zhaozhaozz/MissionCrew/issues"

[project.scripts]
mc = "missioncrew.cli:app"
missioncrew-tool = "missioncrew.agent_tool:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["missioncrew"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
