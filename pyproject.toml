[project]
name = "missioncrew"
version = "0.4.0"
description = "Channel 驱动的本地多 Agent 协作平台，支持 Issue 化 Task 与项目资料"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.scripts]
mc = "missioncrew.cli:app"
missioncrew-tool = "missioncrew.agent_tool:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["missioncrew"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
